"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"
[scripts]
setup = "npm ci"
run_mode = "concurrent"
[scripts.run.dev]
available_in = ["local"]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"
[scripts.run.check]
command = "npm run check"
icon = "test-tube"
